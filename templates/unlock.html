<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Folder Locked - Nexus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="fm-body" style="display: flex; justify-content: center; align-items: center; height: 100vh;">
  <div class="glass-panel" style="padding: 40px; text-align: center; max-width: 400px; width: 100%;">
    <i class="ph-fill ph-lock-key" style="font-size: 4rem; color: var(--primary); margin-bottom: 20px;"></i>
    <h2 style="margin-bottom: 10px;">Folder Locked</h2>
    <p class="text-muted" style="margin-bottom: 20px;">This folder requires a password to access.</p>
    <form id="unlockForm" onsubmit="unlock(event)">
      <input type="password" id="folderPassword" placeholder="Enter password" required style="width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white;">
      <button type="submit" style="width: 100%; padding: 10px;">Unlock</button>
    </form>
    <p id="errorMsg" style="color: #ff6b6b; margin-top: 15px; display: none;"></p>
    <a href="{{ url_for('index', path=path.rsplit('/', 1)[0] if '/' in path else '') }}" class="action-btn" style="display: block; margin-top: 15px; text-decoration: none;">Go Back</a>
  </div>
  <script>
    async function unlock(e) {
      e.preventDefault();
      const pw = document.getElementById('folderPassword').value;
      const btn = document.querySelector('button[type="submit"]');
      const err = document.getElementById('errorMsg');
      btn.disabled = true; err.style.display = 'none';
      try {
        const res = await fetch('/api/folder/unlock', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': {{ csrf_token()|tojson }} },
          body: JSON.stringify({ path: {{ path|tojson }}, password: pw })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.reload();
        } else {
          err.innerText = data.error || 'Incorrect password';
          err.style.display = 'block';
          btn.disabled = false;
        }
      } catch (error) {
        err.innerText = 'Network error';
        err.style.display = 'block';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
