<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nexus File Manager - Account</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><script src="https://unpkg.com/@phosphor-icons/web"></script></head><body class="fm-body">
<nav class="navbar"><h2><i class="ph ph-gear" style="color:var(--primary)"></i> My account / <span>{{ username }}</span></h2><a class="btn-logout" href="{{ url_for('index') }}">Back to files</a></nav>
<main class="main-container"><section class="glass-panel user-management account-card"><h3>Change password</h3><p class="text-muted">Enter your current password to set a new one.</p><form id="passwordForm" class="user-create-form"><input id="currentPassword" type="password" placeholder="Current password" required autocomplete="current-password"><input id="newPassword" type="password" placeholder="New password (at least 10 characters)" required minlength="10" autocomplete="new-password"><input id="confirmPassword" type="password" placeholder="Confirm new password" required minlength="10" autocomplete="new-password"><button type="submit">Change password</button></form><p id="message" class="text-muted" aria-live="polite"></p></section></main>
<script>const csrfToken={{ csrf_token|tojson }};document.getElementById('passwordForm').addEventListener('submit',async e=>{e.preventDefault();if(newPassword.value!==confirmPassword.value){message.textContent='New passwords do not match.';return;}const r=await fetch('/api/account/password',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify({current_password:currentPassword.value,new_password:newPassword.value})});const d=await r.json().catch(()=>({}));if(r.ok){message.textContent='Password changed. Please sign in again.';setTimeout(()=>location.href='/login',800)}else message.textContent=d.error||'Could not change password';});</script></body></html>
